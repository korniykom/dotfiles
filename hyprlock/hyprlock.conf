$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 4, easeOut
    animation = inputFieldWidth, 1, 4, easeOut
}

# Same wallpaper as hyprpaper, blurred and dimmed so white text reads clearly
background {
    monitor =
    path = ~/.config/hypr/wallpaper/silksong_background.jpg
    blur_passes = 2
    blur_size = 4
    noise = 0.01
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Backdrop clock: huge and faint, drawn first so everything sits on top of it
label {
    monitor =
    text = <span font_weight='800' letter_spacing='-8192'>$TIME</span>
    color = rgba(255, 255, 255, 0.08)
    font_size = 380
    font_family = Adwaita Sans

    position = 0, 60
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "<span font_weight='500'>$(date +'%A, %-d %B')</span>"
    color = rgba(255, 255, 255, 0.75)
    font_size = 18
    font_family = Adwaita Sans
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)

    position = 0, 30
    halign = center
    valign = center
}

# Time
label {
    monitor =
    # Crisp small clock with a crimson colon
    text = cmd[update:1000] echo "<span font_weight='700'>$(date +%H)<span foreground='##c0282f'>:</span>$(date +%M)</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 64
    font_family = Adwaita Sans
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = -1
    outline_thickness = 2
    # Frosted glass: bright top-left edge fading out, faint white fill
    outer_color = rgba(255, 255, 255, 0.45) rgba(255, 255, 255, 0.06) 45deg
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = $font
    check_color = rgba(255, 255, 255, 0.85) rgba(255, 255, 255, 0.2) 120deg
    fail_color = rgba(192, 40, 47, 0.95) rgba(192, 40, 47, 0.3) 45deg
    capslock_color = rgba(224, 175, 104, 0.95) rgba(224, 175, 104, 0.3) 45deg

    dots_size = 0.2
    dots_spacing = 0.55
    dots_rounding = -1
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffb3">󰌾  Enter password</span>
    check_text = <span foreground="##ffffffb3">Unlocking…</span>
    fail_text = <span foreground="##ffffff">$PAMFAIL</span> <span foreground="##ffffff80">($ATTEMPTS)</span>
    hide_input = false

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)

    position = 0, -60
    halign = center
    valign = center
}

# Battery (prints nothing on machines without one)
label {
    monitor =
    text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$b" ] && echo "󰁹  $b%"
    color = rgba(255, 255, 255, 0.6)
    font_size = 11
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)

    position = 30, 20
    halign = left
    valign = bottom
}

# Keyboard layout
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 11
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)

    position = -30, 20
    halign = right
    valign = bottom
}
